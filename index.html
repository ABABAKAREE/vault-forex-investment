<!DOCTYPE html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault Invest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="vault-body auth-page">
    <main class="main-area auth-shell">
      <section class="panel auth-card" aria-label="Account access">
        <div class="auth-brand">
          <p class="welcome-kicker">Vault Invest</p>
          <h1 class="auth-title">Log in or create your account</h1>
          <p class="auth-subtitle">Only the sign in and sign up section is shown for a cleaner entry experience.</p>
        </div>

        <form class="transaction-form" id="auth-form">
          <div class="auth-extra-fields hidden" id="signup-fields">
            <div class="form-grid transaction-grid">
              <label class="field-group">
                <span>Full Name (for sign up)</span>
                <input type="text" id="auth-fullname" placeholder="Your full name" autocomplete="name" />
              </label>
              <label class="field-group">
                <span>Phone (optional)</span>
                <input type="text" id="auth-phone" placeholder="+2557XXXXXXXX" autocomplete="tel" />
              </label>
            </div>
          </div>
          <div class="form-grid transaction-grid">
            <label class="field-group">
              <span>Email</span>
              <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" required />
            </label>
            <label class="field-group">
              <span>Password</span>
              <input type="password" id="auth-password" placeholder="Minimum 8 characters" autocomplete="current-password" required />
            </label>
          </div>
          <p class="auth-feedback" id="auth-feedback">Sign in to load your real account balance and vault activity.</p>
          <div class="modal-actions auth-actions">
            <button class="primary-btn" type="submit" id="auth-login-btn" data-auth-action="login">Sign In</button>
            <button class="secondary-btn" type="submit" id="auth-register-btn" data-auth-action="register">Create Account</button>
          </div>
        </form>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Bottom navigation">
      <a href="home.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.2 12 4l8 6.2V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z" fill="currentColor" /></svg>
        <span>Home</span>
      </a>
      <a href="plans.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5zM8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <span>Pledge</span>
      </a>
      <a href="my-account.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
        <span>My Account</span>
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.3-3.5a7.8 7.8 0 0 0-.1-1.2l2-1.6-2-3.4-2.5 1a8.2 8.2 0 0 0-2.1-1.2L14.3 3h-4.6l-.3 2.6a8.2 8.2 0 0 0-2.1 1.2l-2.5-1-2 3.4 2 1.6a7.8 7.8 0 0 0 0 2.4l-2 1.6 2 3.4 2.5-1a8.2 8.2 0 0 0 2.1 1.2l.3 2.6h4.6l.3-2.6a8.2 8.2 0 0 0 2.1-1.2l2.5 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
        <span>Settings</span>
      </a>
    </nav>

    <script src="assets/js/auth-helpers.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
